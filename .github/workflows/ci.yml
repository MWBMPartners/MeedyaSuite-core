name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features --locked

      - name: cargo test --workspace
        run: cargo test --workspace --all-features --locked

      # Enforcing as of 2026-09-01. The tree is clippy-clean workspace-wide
      # with --all-targets --all-features, so the "promote once those are
      # cleaned up" note this step used to carry has been actioned:
      # the four remaining warnings (an unreachable identical-branch arm in
      # lyricsfile_ttml_classify, plus an unused import, a dead helper and a
      # post-Default field assignment in mik.rs) were fixed rather than
      # suppressed. Keep it enforcing — an informational red step trains
      # people to ignore CI.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  feature-matrix:
    name: Feature matrix (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-featmatrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-featmatrix-
            ${{ runner.os }}-cargo-

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # The `backend` job only ever compiles --all-features. Downstream apps
      # consume DEFAULT features (meedya-providers ships zero providers by
      # default; meedya-core selects individual crates), so a missing
      # `#[cfg(feature = ...)]` guard or a feature-dependent import breaks a
      # consumer while CI stays green. These legs close that gap.
      - name: cargo build --workspace (default features)
        run: cargo build --workspace --locked

      - name: cargo test --workspace (default features)
        run: cargo test --workspace --locked

      # --each-feature compiles each feature on its own (plus none and all),
      # which is what catches a module that only compiles when a sibling
      # feature happens to be on. Scoped to the three crates with a real
      # feature surface — the powerset of all 13 provider flags would be
      # pointless minutes. --no-dev-deps keeps it to the shipping surface.
      - name: cargo hack --each-feature (crates with feature surfaces)
        run: |
          cargo hack check --each-feature --no-dev-deps --locked \
            -p meedya-core -p meedya-providers -p meedya-fingerprint -p meedya-audio-analysis

  doc-counts:
    name: Doc test-count guard (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doccounts-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doccounts-
            ${{ runner.os }}-cargo-

      # Doc-count drift is this repo's chronic failure mode: 248, 466, 533,
      # 546, 601, 653 and 664 have all appeared in the docs and none matched
      # the code. The counts are a contract signal partner apps read, so a
      # silently wrong number is worse than no number. See issue #71.
      #
      # The suite is run here rather than reusing the `backend` job's run
      # because jobs do not share a filesystem; the script takes the totals
      # as arguments so it does not run anything a third time.
      #
      # `shell: bash` and `set -euo pipefail`, and cargo's exit status
      # captured explicitly, so a failing test run fails this step. Without
      # them (GitHub's default shell runs `bash -e`, with no pipefail) the
      # pipe from cargo into grep and awk reported awk's success: a run with
      # a failing test was counted as if it had passed, and the step went on
      # (reproduced with a stand-in cargo that exits 101; found by Codex's
      # review r7). The script's own measuring path does the same.
      - name: Measure and compare documented test counts
        shell: bash
        run: |
          set -euo pipefail
          sum() {
            local out status=0
            out=$(cargo test --workspace "$@" --locked --no-fail-fast 2>&1) || status=$?
            if [ "$status" -ne 0 ]; then
              printf '%s\n' "$out" | tail -n 40 >&2
              echo "::error::cargo test --workspace $* failed (status $status); tests not counted" >&2
              return "$status"
            fi
            printf '%s\n' "$out" \
              | grep -E '^test result' \
              | awk -F'[ ;]' '{p += $4} END {print p + 0}'
          }
          ALL=$(sum --all-features)
          DEFAULT=$(sum)
          echo "measured: $DEFAULT default-features, $ALL --all-features"
          ./scripts/check-doc-test-counts.sh "$DEFAULT" "$ALL"

  dependency-audit:
    name: cargo-deny (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Advisories, licence allowlist and duplicate-version bans. Until this
      # existed, .claude/MEMORY.md asserted licence compatibility "is checked
      # at the Cargo.lock level by CI" — a control the team believed in that
      # did not exist. See issue #84 and deny.toml for the policy.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  frontend:
    name: Frontend (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MeedyaSuite-core is a pure-Rust workspace. The `Frontend` check
      # exists to satisfy a branch-protection requirement inherited from
      # the org template; there is no frontend code to build here.
      # Replace this with a real frontend build if/when one is added.
      - name: No frontend in this repo
        run: echo "MeedyaSuite-core has no frontend; nothing to build."

  # MWBM-MEDIA-LANG (#99): the shared language policy's machine-readable
  # parts. The Rust implementation's conformance tests run in the `backend`
  # job's `cargo test`; this job covers everything cargo cannot see:
  #   - both JSON files still match their schemas (the schemas are the
  #     documentation other repositories read, so a drift here misleads them);
  #   - the copy checker's own tests (an independent review showed the first
  #     version could report a pass on copies that did not match; the tests
  #     keep each of those holes closed);
  #   - the PHP implementation passes every conformance case, on the oldest
  #     PHP the consuming sites run (8.1) and on a current one.
  # The data file is NOT regenerated here: its sources (the IANA registry)
  # only publish their newest version, so regeneration is a deliberate,
  # recorded act, not something CI can repeat. See
  # scripts/media-lang/generate_language_data.py.
  language-policy:
    name: Language policy (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the test cases and data against their schemas
        run: |
          python -m pip install --quiet "jsonschema==4.23.0"
          python scripts/media-lang/validate_json.py

      - name: Copy checker tests
        run: python -m unittest scripts/media-lang/test_check_copies.py

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP conformance (every case)
        run: php bindings/php/media-language/tests/run-conformance.php
