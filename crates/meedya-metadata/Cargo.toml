[package]
name = "meedya-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Meedya Core — tag schemas, metadata read/write, TOML tag registry"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
lofty = { workspace = true }
mp4ameta = "0.13"
regex = { workspace = true }
strum = { workspace = true }
meedya-codecs = { workspace = true }
meedya-fingerprint = { workspace = true }
meedya-lang = { workspace = true }

# Windows only: which file a handle holds (volume serial number and file
# index, `GetFileInformationByHandle`), so an M4A save can check that a name
# still names the file it opened before replacing it (`save_by_copy`). The
# standard library's own way to read those two numbers is not stable yet;
# this is a small, safe wrapper (Unlicense OR MIT) that keeps `unsafe` out
# of this workspace.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

# macOS only: reading a file's or folder's access control list (ACL), so an
# M4A save can refuse what it cannot keep private or carry over
# (`access_rules`; Codex's review of revision 11, finding 1). macOS keeps
# these lists out of reach of the extended-attribute calls, and the
# standard library has no way to read them; this is a small, safe wrapper
# (MIT) over the system's own `acl_*` calls that keeps `unsafe` out of this
# workspace. It is used to READ only, by name: nothing here writes a list.
[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.12"

# Linux and Android only: there a file's access control list is an extended
# attribute (`system.posix_acl_access`), which this safe wrapper over the
# system calls reads, writes and removes through the file's open handle
# (`access_rules`). Already in the lockfile through `tempfile`.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
